name: Swag App Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        type: choice
        options:
          - UI
          - API
          - Accessibility
          - BDD
          - All
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e:
    name: Run ${{ inputs.suite || 'All' }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_artifact: ${{ steps.upload-pages.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npm run install:browser

      - name: Run selected test suite
        env:
          SUITE: ${{ inputs.suite || 'All' }}
        run: |
          case "$SUITE" in
            UI) npm run test:ui ;;
            API) npm run test:api ;;
            Accessibility) npm run test:a11y ;;
            BDD) npm run test:bdd -- --tags @bdd ;;
            All) npm run test:all ;;
            *) echo "Unsupported test suite: $SUITE" >&2; exit 1 ;;
          esac

      - name: Generate Allure HTML reports
        if: always()
        env:
          SUITE: ${{ inputs.suite || 'All' }}
        run: |
          case "$SUITE" in
            UI) suites="ui" ;;
            API) suites="api" ;;
            Accessibility) suites="accessibility" ;;
            BDD) suites="bdd" ;;
            All) suites="ui api accessibility bdd" ;;
            *) echo "Unsupported test suite: $SUITE" >&2; exit 1 ;;
          esac

          for suite in $suites; do
            results="reports/$suite/allure-results"
            if [ -d "$results" ] && find "$results" -type f -print -quit | grep -q .; then
              npx allure generate "$results" --output "reports/$suite/allure-report"
            else
              echo "No Allure results found for $suite; skipping report generation."
            fi
          done

      - name: Prepare GitHub Pages report site
        if: always()
        id: prepare-pages
        env:
          SUITE: ${{ inputs.suite || 'All' }}
        run: |
          case "$SUITE" in
            UI) suites="ui:User Interface" ;;
            API) suites="api:API" ;;
            Accessibility) suites="accessibility:Accessibility" ;;
            BDD) suites="bdd:BDD" ;;
            All) suites="ui:User Interface api:API accessibility:Accessibility bdd:BDD" ;;
            *) echo "Unsupported test suite: $SUITE" >&2; exit 1 ;;
          esac

          mkdir -p pages-site
          cat > pages-site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>E2E Test Reports</title>
            <style>
              body { font: 16px system-ui, sans-serif; max-width: 760px; margin: 4rem auto; padding: 0 1.5rem; color: #202124; }
              h1 { margin-bottom: .5rem; }
              p { color: #5f6368; }
              li { margin: .8rem 0; }
              a { color: #0969da; }
            </style>
          </head>
          <body>
            <h1>E2E Test Reports</h1>
            <p>Select a suite to view its Allure report from this workflow run.</p>
            <ul>
          EOF

          for entry in $suites; do
            suite="${entry%%:*}"
            label="${entry#*:}"
            report="reports/$suite/allure-report"
            if [ -f "$report/index.html" ]; then
              mkdir -p "pages-site/$suite"
              cp -R "$report/." "pages-site/$suite/"
              printf '      <li><a href="%s/">%s</a></li>\n' "$suite" "$label" >> pages-site/index.html
            else
              echo "No Allure HTML report found for $suite; skipping it."
            fi
          done

          cat >> pages-site/index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

          if ! grep -q '<li>' pages-site/index.html; then
            echo "No Allure HTML reports were generated for this run." >> pages-site/index.html
          fi

      - name: Upload test reports and results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ inputs.suite || 'All' }}-reports
          path: |
            playwright-report/
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.prepare-pages.outcome == 'success'
        id: upload-pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Explain skipped Pages deployment
        if: always() && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: echo "GitHub Pages deployment is restricted to the default branch. Download the e2e-${{ inputs.suite || 'All' }}-reports artifact for this run." >> "$GITHUB_STEP_SUMMARY"

  deploy-reports:
    name: Publish Allure reports
    needs: e2e
    if: >-
      always() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.e2e.outputs.pages_artifact == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy reports to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report link to workflow summary
        if: steps.deployment.outputs.page_url != ''
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "Allure reports are available at [$PAGE_URL]($PAGE_URL)." >> "$GITHUB_STEP_SUMMARY"
