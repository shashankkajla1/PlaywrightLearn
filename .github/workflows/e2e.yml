name: Swag App Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        type: choice
        options:
          - UI
          - API
          - Accessibility
          - BDD
          - All

permissions:
  contents: read

jobs:
  e2e:
    name: Run ${{ inputs.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npm run install:browser

      - name: Run selected test suite
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            UI) npm run test:ui ;;
            API) npm run test:api ;;
            Accessibility) npm run test:a11y ;;
            BDD) npm run test:bdd ;;
            All) npm run test:all ;;
            *) echo "Unsupported test suite: $SUITE" >&2; exit 1 ;;
          esac

      - name: Upload test reports and results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-${{ inputs.suite }}-reports
          path: |
            playwright-report/
            test-results/
            reports/
          if-no-files-found: ignore
          retention-days: 14
